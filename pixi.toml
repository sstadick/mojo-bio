[workspace]
name = "mojo-bio"
version = "0.1.0"
description = "Generic in-place integer radix sorting for Mojo"
channels = ["https://conda.modular.com/max", "conda-forge", "https://repo.prefix.dev/modular-community"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]
requires-pixi = ">=0.80"

[package]
name = "mojo-bio"
version = "0.1.0"
license = "MIT"
license-file = "LICENSE"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*", channels = ["https://prefix.dev/pixi-build-backends", "conda-forge"] }

[package.build.config.pkg]
name = "mojo_bio"
path = "src/mojo_bio"

[package.host-dependencies]
mojo-compiler = "==1.2.0"

[package.build-dependencies]
mojo-compiler = "==1.2.0"

[package.run-dependencies]
mojo-compiler = "==1.2.0"

[dependencies]
mojo-compiler = "==1.2.0"
mojo = "==1.2.0"
python = ">=3.11,<3.15"

[tasks]
t = "mojo run -I src -D ASSERT=all test/test_radix_sort.mojo"
example = "mojo run -I src examples/sort.mojo"
bench = "python3 bench/run_mojo_radix_sort_bench.py"
check-consumer = "python3 scripts/check_consumer.py"
format = "mojo format src/mojo_bio test examples bench/radix_sort_bench.mojo"
docs = "python scripts/docs.py"
